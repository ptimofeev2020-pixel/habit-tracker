name: CI/CD

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: habits-web
  APP_DIR: habits

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: pip install flake8==7.3.0
      - name: Run flake8
        run: flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habits_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: 'False'
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: habits_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: |
          coverage run --source='.' --omit='*/migrations/*,manage.py,config/*sgi.py' manage.py test
          coverage report

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
      - name: Check image
        run: docker run --rm -e SECRET_KEY=check -e DB_ENGINE=django.db.backends.sqlite3 -e DB_NAME=/tmp/db.sqlite3 ${{ env.IMAGE_NAME }}:latest python manage.py check
      - name: Check docker compose config
        run: |
          cp .env.template .env
          docker compose config --quiet
      - name: Save image
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=False
          ALLOWED_HOSTS=${{ secrets.SSH_HOST }},localhost,127.0.0.1
          DB_ENGINE=django.db.backends.postgresql
          DB_NAME=habits
          DB_USER=postgres
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=db
          DB_PORT=5432
          CORS_ALLOWED_ORIGINS=http://${{ secrets.SSH_HOST }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          EOF
      - name: Copy files to server
        run: |
          TARGET=${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          ssh -i ~/.ssh/id_deploy $TARGET "mkdir -p ~/${{ env.APP_DIR }}/nginx"
          scp -i ~/.ssh/id_deploy image.tar.gz docker-compose.yml .env $TARGET:~/${{ env.APP_DIR }}/
          scp -i ~/.ssh/id_deploy nginx/default.conf $TARGET:~/${{ env.APP_DIR }}/nginx/
      - name: Start containers on server
        run: |
          ssh -i ~/.ssh/id_deploy ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ~/${{ env.APP_DIR }} &&
            gunzip -c image.tar.gz | docker load &&
            rm image.tar.gz &&
            chmod 600 .env &&
            docker compose up -d --no-build --remove-orphans &&
            docker image prune -f
          "
      - name: Check application
        run: |
          sleep 15
          curl --fail --retry 5 --retry-delay 5 http://${{ secrets.SSH_HOST }}/api/docs/
